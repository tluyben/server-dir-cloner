version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Core API settings
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/data/content.prod.db

      # CORS settings (optional)
      - CORS_ORIGIN=${CORS_ORIGIN:-*}

      # Additional environment variables (optional)
      - API_SECRET=${API_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}

    volumes:
      # Mount current directory as /data for persistent database storage
      - ./:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  app_network:
    driver: bridge
