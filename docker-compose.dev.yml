# Development Docker Compose for Directory Cloner API
# Optimized for local development with hot reload and debugging
version: '3.8'

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: directory-cloner-dev
    restart: unless-stopped

    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=/app/content.db
      - API_PREFIX=/api
      - CORS_ORIGIN=http://localhost:3000
      - LOG_LEVEL=debug

    volumes:
      # Mount source code for hot reload
      - .:/app
      # Use named volume for node_modules to avoid conflicts
      - node_modules:/app/node_modules
      # Persist database between container restarts
      - ./content.db:/app/content.db
      # Mount test sync directories
      - ./test-sync:/test-sync

    ports:
      - '3000:3000'
      # Optional: Expose debug port for Node.js debugger
      - '9229:9229'

    networks:
      - dev-network

    # Override CMD to enable debugging
    command: npm run dev

    stdin_open: true
    tty: true

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional: Second dev instance for testing multi-server sync
  dev-replica:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: directory-cloner-dev-replica
    restart: unless-stopped
    profiles:
      - multi-server

    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=/app/content.db
      - API_PREFIX=/api
      - CORS_ORIGIN=http://localhost:3001
      - SERVER_ID=dev-server-replica
      - SERVER_NAME=Dev Replica
      - LOG_LEVEL=debug

    volumes:
      - .:/app
      - node_modules_replica:/app/node_modules
      - ./content-replica.db:/app/content.db
      - ./test-sync:/test-sync

    ports:
      - '3001:3000'

    networks:
      - dev-network

    command: npm run dev

    stdin_open: true
    tty: true

networks:
  dev-network:
    driver: bridge

volumes:
  node_modules:
  node_modules_replica:
